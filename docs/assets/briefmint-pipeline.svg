<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" fill="none"><title>BriefMint private-to-public pipeline</title><desc>Six steps from private notes through 0G drafting and exact owner approval to Arkiv publication and independent discovery. This is a system diagram, not live execution evidence.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#566A61" stroke-width="1.5"/></marker></defs><rect width="1280" height="470" rx="20" fill="#FAFCFA"/><g font-family="Inter, Arial, sans-serif"><text x="36" y="50" font-size="30" fill="#253F33" font-weight="700" text-anchor="start">From private context to a public opportunity</text><text x="36" y="82" font-size="18" fill="#60766B" font-weight="400" text-anchor="start">A deliberate publishing boundary at every step.</text><rect x="28" y="116" width="812" height="248" rx="16" fill="#EFF6F1"/><rect x="850" y="116" width="402" height="248" rx="16" fill="#E4F1EA"/><text x="45" y="145" font-size="12" fill="#537461" font-weight="600" text-anchor="start">PRIVATE PREPARATION + OWNER REVIEW</text><text x="869" y="145" font-size="12" fill="#32704C" font-weight="600" text-anchor="start">APPROVED PUBLIC DATA ONLY</text><text x="44" y="181" font-size="12" fill="#687B70" font-weight="600" text-anchor="start">01 / INTAKE</text><rect x="44" y="198" width="168" height="132" rx="14" fill="#FFFFFF" stroke="#88AB95" stroke-width="2"/><text x="64" y="232" font-size="17" fill="#253F33" font-weight="600" text-anchor="start">Private notes</text><text x="64" y="262" font-size="14" fill="#51675C" font-weight="400" text-anchor="start">Wallet sign-in</text><text x="64" y="287" font-size="14" fill="#51675C" font-weight="400" text-anchor="start">Saved source</text><path d="M217 263H241" stroke="#566A61" stroke-width="2" marker-end="url(#arrow)"/><text x="249" y="181" font-size="12" fill="#687B70" font-weight="600" text-anchor="start">02 / 0G</text><rect x="249" y="198" width="168" height="132" rx="14" fill="#FFFFFF" stroke="#88AB95" stroke-width="2"/><text x="269" y="232" font-size="17" fill="#253F33" font-weight="600" text-anchor="start">Structured draft</text><text x="269" y="262" font-size="14" fill="#51675C" font-weight="400" text-anchor="start">Bounded request</text><text x="269" y="287" font-size="14" fill="#51675C" font-weight="400" text-anchor="start">Validated output</text><path d="M422 263H446" stroke="#566A61" stroke-width="2" marker-end="url(#arrow)"/><text x="454" y="181" font-size="12" fill="#687B70" font-weight="600" text-anchor="start">03 / EDIT</text><rect x="454" y="198" width="168" height="132" rx="14" fill="#FFFFFF" stroke="#88AB95" stroke-width="2"/><text x="474" y="232" font-size="17" fill="#253F33" font-weight="600" text-anchor="start">Owner review</text><text x="474" y="262" font-size="14" fill="#51675C" font-weight="400" text-anchor="start">Edit deliverables</text><text x="474" y="287" font-size="14" fill="#51675C" font-weight="400" text-anchor="start">Save a revision</text><path d="M627 263H651" stroke="#566A61" stroke-width="2" marker-end="url(#arrow)"/><text x="659" y="181" font-size="12" fill="#687B70" font-weight="600" text-anchor="start">04 / APPROVE</text><rect x="659" y="198" width="168" height="132" rx="14" fill="#FFFFFF" stroke="#88AB95" stroke-width="2"/><text x="679" y="232" font-size="17" fill="#253F33" font-weight="600" text-anchor="start">Exact payload</text><text x="679" y="262" font-size="14" fill="#51675C" font-weight="400" text-anchor="start">Public allowlist</text><text x="679" y="287" font-size="14" fill="#51675C" font-weight="400" text-anchor="start">Revision + hash</text><path d="M832 263H856" stroke="#566A61" stroke-width="2" marker-end="url(#arrow)"/><text x="864" y="181" font-size="12" fill="#687B70" font-weight="600" text-anchor="start">05 / ARKIV</text><rect x="864" y="198" width="168" height="132" rx="14" fill="#FFFFFF" stroke="#88AB95" stroke-width="2"/><text x="884" y="232" font-size="17" fill="#253F33" font-weight="600" text-anchor="start">Wallet publish</text><text x="884" y="262" font-size="14" fill="#51675C" font-weight="400" text-anchor="start">Owner signs</text><text x="884" y="287" font-size="14" fill="#51675C" font-weight="400" text-anchor="start">Receipt + readback</text><path d="M1037 263H1061" stroke="#566A61" stroke-width="2" marker-end="url(#arrow)"/><text x="1069" y="181" font-size="12" fill="#687B70" font-weight="600" text-anchor="start">06 / READ</text><rect x="1069" y="198" width="168" height="132" rx="14" fill="#FFFFFF" stroke="#88AB95" stroke-width="2"/><text x="1089" y="232" font-size="17" fill="#253F33" font-weight="600" text-anchor="start">Public discovery</text><text x="1089" y="262" font-size="14" fill="#51675C" font-weight="400" text-anchor="start">Indexed filters</text><text x="1089" y="287" font-size="14" fill="#51675C" font-weight="400" text-anchor="start">Independent client</text><text x="36" y="404" font-size="17" fill="#5D6E64" font-weight="400" text-anchor="start">Requested 0G private routing; independent TEE verification remains unavailable.</text><text x="36" y="434" font-size="17" fill="#5D6E64" font-weight="400" text-anchor="start">Arkiv success requires confirmed network evidence. Unknown broadcasts are not automatically retried.</text></g></svg>
