<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" fill="none"><title>PUBLIC PAYLOAD APPROVAL screenshot slot</title><desc>Clearly labeled placeholder for a future real screenshot; no screenshot is fabricated.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#566A61" stroke-width="1.5"/></marker></defs><rect width="800" height="390" rx="20" fill="#FAFCFA"/><g font-family="Inter, Arial, sans-serif"><rect x="22" y="22" width="756" height="346" rx="16" stroke="#8EA797" stroke-width="2" stroke-dasharray="9 7"/><text x="400" y="113" font-size="15" fill="#789182" font-weight="600" text-anchor="middle">SCREENSHOT SLOT</text><text x="400" y="167" font-size="27" fill="#253F33" font-weight="700" text-anchor="middle">PUBLIC PAYLOAD APPROVAL</text><text x="400" y="220" font-size="17" fill="#253F33" font-weight="400" text-anchor="middle">Show the exact public preview, revision and approval hash.</text><text x="400" y="260" font-size="16" fill="#687B70" font-weight="400" text-anchor="middle">Add approval-preview.png and update the README image link.</text><text x="400" y="320" font-size="15" fill="#789182" font-weight="400" text-anchor="middle">Placeholder — not a product capture</text></g></svg>
