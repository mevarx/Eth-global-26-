<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" fill="none"><title>BriefMint system and trust-boundary map</title><desc>Owner browser, authenticated application, 0G inference service, Arkiv public network and independent reader. Arrows distinguish private requests, owner-signed writes and read-only verification.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#566A61" stroke-width="1.5"/></marker></defs><rect width="1600" height="1030" rx="20" fill="#FAFCFA"/><g font-family="Inter, Arial, sans-serif"><text x="45" y="52" font-size="34" fill="#253F33" font-weight="700" text-anchor="start">BriefMint / system map</text><text x="45" y="85" font-size="19" fill="#60766B" font-weight="400" text-anchor="start">Private drafting, exact owner approval, independently readable public records.</text><rect x="40" y="124" width="440" height="500" rx="20" fill="#F2F7F3" stroke="#668774" stroke-width="2"/><text x="62" y="162" font-size="20" fill="#253F33" font-weight="700" text-anchor="start">OWNER BROWSER</text><text x="62" y="191" font-size="16" fill="#60766B" font-weight="400" text-anchor="start">Wallet secrets stay in the wallet</text><rect x="530" y="124" width="490" height="500" rx="20" fill="#F2F7F3" stroke="#668774" stroke-width="2"/><text x="552" y="162" font-size="20" fill="#253F33" font-weight="700" text-anchor="start">APPLICATION HOST</text><text x="552" y="191" font-size="16" fill="#60766B" font-weight="400" text-anchor="start">Trusted backend · access-controlled SQLite</text><rect x="1110" y="124" width="450" height="500" rx="20" fill="#F2F7F3" stroke="#668774" stroke-width="2"/><text x="1132" y="162" font-size="20" fill="#253F33" font-weight="700" text-anchor="start">ARKIV RABDI</text><text x="1132" y="191" font-size="16" fill="#60766B" font-weight="400" text-anchor="start">Public network · chain 7794095</text><rect x="65" y="222" width="390" height="101" rx="14" fill="#FFFFFF" stroke="#789386" stroke-width="2"/><text x="85" y="256" font-size="21" fill="#253F33" font-weight="600" text-anchor="start">Tool City / Next.js UI</text><text x="85" y="286" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Planning Desk · AI Studio · Archive</text><rect x="65" y="357" width="390" height="101" rx="14" fill="#FFFFFF" stroke="#789386" stroke-width="2"/><text x="85" y="391" font-size="21" fill="#253F33" font-weight="600" text-anchor="start">Review + public preview</text><text x="85" y="421" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Owner approves revision + SHA-256</text><rect x="65" y="492" width="390" height="101" rx="14" fill="#FFFFFF" stroke="#789386" stroke-width="2"/><text x="85" y="526" font-size="21" fill="#253F33" font-weight="600" text-anchor="start">MetaMask owner wallet</text><text x="85" y="556" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Authentication and Arkiv signing</text><rect x="555" y="222" width="440" height="101" rx="14" fill="#FFFFFF" stroke="#789386" stroke-width="2"/><text x="575" y="256" font-size="21" fill="#253F33" font-weight="600" text-anchor="start">Authenticated API</text><text x="575" y="286" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Owner session · origin · quota / lease</text><rect x="555" y="370" width="210" height="170" rx="14" fill="#FFFFFF" stroke="#789386" stroke-width="2"/><text x="575" y="404" font-size="21" fill="#253F33" font-weight="600" text-anchor="start">Private SQLite</text><text x="575" y="434" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Immutable notes</text><text x="575" y="459" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Saved draft edits</text><text x="575" y="484" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Private evidence</text><rect x="785" y="370" width="210" height="170" rx="14" fill="#FFFFFF" stroke="#789386" stroke-width="2"/><text x="805" y="404" font-size="21" fill="#253F33" font-weight="600" text-anchor="start">Validation</text><text x="805" y="434" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Structured reply</text><text x="805" y="459" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Canonical payload</text><text x="805" y="484" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Approval binding</text><rect x="1135" y="222" width="400" height="101" rx="14" fill="#FFFFFF" stroke="#789386" stroke-width="2"/><text x="1155" y="256" font-size="21" fill="#253F33" font-weight="600" text-anchor="start">Owner-owned opportunity</text><text x="1155" y="286" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">tool-city.opportunity.v1</text><rect x="1135" y="370" width="400" height="170" rx="14" fill="#FFFFFF" stroke="#789386" stroke-width="2"/><text x="1155" y="404" font-size="21" fill="#253F33" font-weight="600" text-anchor="start">Public network evidence</text><text x="1155" y="434" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Receipt and entity readback</text><text x="1155" y="459" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Owner · content · revision · expiry</text><text x="1155" y="484" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Indexed category / language / status</text><path d="M455 266H555" stroke="#566A61" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="245" font-size="14" fill="#253F33" font-weight="400" text-anchor="start">Private</text><text x="480" y="286" font-size="14" fill="#253F33" font-weight="400" text-anchor="start">API calls</text><path d="M665 323V370" stroke="#566A61" stroke-width="2" marker-end="url(#arrow)"/><path d="M890 323V370" stroke="#566A61" stroke-width="2" marker-end="url(#arrow)"/><path d="M455 407H505V303H555" stroke="#566A61" stroke-width="2" marker-end="url(#arrow)"/><text x="457" y="391" font-size="15" fill="#253F33" font-weight="400" text-anchor="start">Approve</text><path d="M260 593V659H1335V540" stroke="#566A61" stroke-width="2" marker-end="url(#arrow)"/><text x="575" y="650" font-size="15" fill="#253F33" font-weight="400" text-anchor="start">Owner-signed public operation only</text><path d="M995 276H1135" stroke="#566A61" stroke-width="2" marker-end="url(#arrow)"/><text x="1028" y="246" font-size="15" fill="#253F33" font-weight="400" text-anchor="start">Read-only</text><text x="1028" y="270" font-size="15" fill="#253F33" font-weight="400" text-anchor="start">checks</text><rect x="555" y="738" width="440" height="161" rx="14" fill="#EDF2FA" stroke="#7991B0" stroke-width="2"/><text x="575" y="772" font-size="21" fill="#253F33" font-weight="600" text-anchor="start">0G Router + model provider</text><text x="575" y="802" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Private routing + verify_tee requested</text><text x="575" y="827" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">No fallbacks · no automatic retries</text><text x="575" y="852" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Structured output validated by server</text><path d="M995 310H1055V800H995" stroke="#566A61" stroke-width="2" marker-end="url(#arrow)"/><text x="1028" y="707" font-size="15" fill="#253F33" font-weight="400" text-anchor="start">Private notes</text><path d="M868 738V540" stroke="#566A61" stroke-width="2" marker-end="url(#arrow)"/><text x="882" y="707" font-size="15" fill="#253F33" font-weight="400" text-anchor="start">Draft + metadata</text><rect x="1110" y="738" width="450" height="161" rx="14" fill="#E8F3EC" stroke="#789386" stroke-width="2"/><text x="1130" y="772" font-size="21" fill="#253F33" font-weight="600" text-anchor="start">Independent public reader</text><text x="1130" y="802" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Direct indexed query / entity lookup</text><text x="1130" y="827" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">No BriefMint API, cookies or private DB</text><text x="1130" y="852" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Network failures differ from zero results</text><path d="M1400 738V540" stroke="#566A61" stroke-width="2" marker-end="url(#arrow)"/><text x="1414" y="703" font-size="15" fill="#253F33" font-weight="400" text-anchor="start">Public reads</text><rect x="40" y="738" width="440" height="161" rx="14" fill="#FFF6E7" stroke="#B99C63" stroke-width="2"/><text x="60" y="772" font-size="21" fill="#253F33" font-weight="600" text-anchor="start">Publication privacy boundary</text><text x="60" y="802" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Only approved public fields cross it.</text><text x="60" y="827" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">Raw notes, source IDs and model</text><text x="60" y="852" font-size="17" fill="#51675C" font-weight="400" text-anchor="start">evidence are omitted from records.</text><text x="45" y="964" font-size="18" fill="#5F6F65" font-weight="400" text-anchor="start">Notes are not end-to-end encrypted. The application host and configured inference service process them.</text><text x="45" y="995" font-size="18" fill="#5F6F65" font-weight="400" text-anchor="start">Independent TEE proof is unavailable. Diagram arrows describe implemented paths, not proof of a new live run.</text></g></svg>
